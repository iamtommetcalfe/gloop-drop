name: Deploy Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# id-token is never granted by the repository's read/write default -- it has to
# be requested explicitly, which is why the auto-generated legacy workflow kept
# failing with "Ensure GITHUB_TOKEN has permission id-token: write".
permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: '.'
      - id: deployment
        uses: actions/deploy-pages@v4
